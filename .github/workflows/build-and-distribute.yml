name: Build and Distribute

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Validate version match
      run: |
        PYPROJECT_VERSION=$(python -c "import tomllib; data=tomllib.load(open('pyproject.toml','rb')); print(data['project']['version'])")
        RELEASE_VERSION=${{ github.event.release.tag_name }}
        RELEASE_VERSION=${RELEASE_VERSION#v}
        
        echo "pyproject.toml version: $PYPROJECT_VERSION"
        echo "GitHub release version: $RELEASE_VERSION"
        
        if [ "$PYPROJECT_VERSION" != "$RELEASE_VERSION" ]; then
          echo "❌ ERROR: Version mismatch!"
          echo "pyproject.toml version ($PYPROJECT_VERSION) does not match GitHub release tag ($RELEASE_VERSION)"
          exit 1
        fi
        echo "✓ Version check passed!"

  build:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build frontend
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python -m pip install --upgrade twine
        twine upload dist/*