# Publishes uncertaintylib to PyPI when a GitHub release is published.
#
# Release routine (see docs/releasing.md):
# 1. Bump `version` in pyproject.toml in a pull request and merge it to main.
# 2. Create and publish a GitHub release whose tag is that version (for example 1.2.0; a leading
#    "v" is accepted).
#
# This workflow then:
# - validate: checks that the release tag matches the version in pyproject.toml.
# - tests:    runs the full test workflow (tests.yml). Its `package` job builds the sdist and the
#             wheel once, tests both installed in clean virtual environments, and keeps them as the
#             artifact `dist`.
# - publish:  downloads exactly those tested files, checks their names against the release
#             version and uploads them with twine. This is the only job that sees the PyPI token.

name: Build and Distribute

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Validate version match
      id: version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        PYPROJECT_VERSION=$(python -c "import tomllib; data=tomllib.load(open('pyproject.toml','rb')); print(data['project']['version'])")
        RELEASE_VERSION=${RELEASE_TAG#v}

        echo "pyproject.toml version: $PYPROJECT_VERSION"
        echo "GitHub release version: $RELEASE_VERSION"

        if [ "$PYPROJECT_VERSION" != "$RELEASE_VERSION" ]; then
          echo "::error::Version mismatch: pyproject.toml version ($PYPROJECT_VERSION) does not match GitHub release tag ($RELEASE_VERSION)"
          exit 1
        fi
        echo "Version check passed."
        echo "version=$PYPROJECT_VERSION" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-latest

    steps:
    - name: Fetch the tested distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist

    - name: Check that exactly the release files are present
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        set -euo pipefail
        ls -l dist
        expected=$(printf '%s\n' "uncertaintylib-${VERSION}-py3-none-any.whl" "uncertaintylib-${VERSION}.tar.gz" | sort)
        found=$(ls dist | sort)
        if [ "${found}" != "${expected}" ]; then
          echo "::error::dist/ does not hold exactly the files of version ${VERSION}."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Publish package to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python -m pip install --upgrade twine
        twine upload --non-interactive dist/*
