# Runs the test suite, checks the built distributions and runs the examples.
#
# Triggers: every pull request and push to main, nightly (to catch breaking changes in
# dependencies such as numpy, scipy, pandas, matplotlib and pvtlib), and workflow_call: the release
# workflow (release.yml) runs this whole workflow on the release commit before it builds the
# release files.
#
# Jobs:
# - test:     flake8 and pytest on Ubuntu (Python 3.10-3.14) and Windows (3.10 and 3.14).
# - package:  builds the sdist and the wheel once (development version from setuptools-scm), checks
#             them with `twine check --strict` and tools/check_distributions.py, then installs each
#             of them into a clean virtual environment and runs a copy of tests/ outside the
#             checkout against it (tools/test_distributions.sh). The files are kept as the
#             artifact `dist`; they are never published.
# - examples: runs every example script and notebook headless (tools/run_examples.py).
# - coverage: test coverage on Python 3.13, kept as the artifact `coverage`.
#
# No job uses a secret.

name: Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # all tags, so setuptools-scm can work out the version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the package and the test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        python -m pip install ".[test]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        MPLBACKEND: Agg
      run: |
        python -m pytest -p no:cacheprovider

  package:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # all tags, so setuptools-scm can work out the version
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Build the sdist and the wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
    - name: Check the metadata with twine
      run: |
        twine check --strict dist/*
    - name: Check the file names and the content of the distributions
      id: check
      # The version is the development version setuptools-scm derives from the latest tag, for
      # example 1.1.3.dev12+g1a2b3c4; the release workflow builds from a tag instead.
      run: |
        set -euo pipefail
        version=$(python tools/check_distributions.py dist)
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
    - name: Test the wheel and the sdist in clean environments
      # See tools/test_distributions.sh: each distribution is installed into a new virtual
      # environment and tested with a copy of tests/ outside the checkout; the sdist is unpacked
      # into a folder without .git. tests/test_installed_package.py asserts inside the pytest
      # session that uncertaintylib is imported from the virtual environment with that version.
      env:
        VERSION: ${{ steps.check.outputs.version }}
      run: |
        bash tools/test_distributions.sh dist "${VERSION}"
    - name: Keep the tested distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error
        retention-days: 7

  examples:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # all tags, so setuptools-scm can work out the version
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install the package and the example dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[examples]"
    - name: Run every example script and notebook
      # The examples are copied to RUNNER_TEMP and run from there; nothing is written back to the
      # checkout. Each script or notebook has 15 minutes.
      run: |
        python tools/run_examples.py --work-dir "${RUNNER_TEMP}/examples-run" --timeout-seconds 900

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # all tags, so setuptools-scm can work out the version
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install the package and the test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]" pytest-cov
    - name: Test with coverage
      env:
        MPLBACKEND: Agg
      run: |
        python -m pytest -p no:cacheprovider --cov=uncertaintylib --cov-report=xml --cov-report=term
    - name: Keep the coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage
        path: coverage.xml
        if-no-files-found: error
