# Builds the documentation site with Sphinx (MyST-NB, furo) and publishes it to GitHub Pages.
#
# - Pull requests: the site is built with warnings treated as errors, so a broken docstring, link
#   or page fails the check. Nothing is published.
# - Push to main and manual runs on main: the site is built and deployed to GitHub Pages.
#
# One-time repository setting: Settings -> Pages -> Source: "GitHub Actions".

name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run does not cancel one that is already publishing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
    - name: Install the package and the documentation tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Build the site
      run: |
        sphinx-build -W --keep-going -b html docs docs/_build/html
    - name: Upload the site
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
