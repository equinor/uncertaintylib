[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertaintylib"
version = "1.1.0"
authors = [
    { name = "Christian Hågenvik", email = "chaagen2013@gmail.com" },
]
description = "A library containing functions used for estimating uncertainties"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["uncertainty", "uncertainty analysis", "uncertainty estimation", "uncertainty quantification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.2",
    "scipy>=1.11.4",
    "pandas>=2.1.4",
    "matplotlib>=3.9.0",
    "fonttools>=4.60.2", # Dependency of matplotlib. Pinned because of dependabot alert.
    "pillow>=12.1.1",    # Dependency of matplotlib. Pinned because of dependabot alert.
]

[project.urls]
Homepage = "https://github.com/equinor/uncertaintylib"
