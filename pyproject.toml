[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertaintylib"
version = "1.1.2"
authors = [
    { name = "Christian Hågenvik", email = "chaagen2013@gmail.com" },
]
description = "A library containing functions used for estimating uncertainties"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["uncertainty", "uncertainty analysis", "uncertainty estimation", "uncertainty quantification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.2",
    "scipy>=1.11.4",
    "pandas>=2.1.4",
    "matplotlib>=3.9.0",
    "fonttools>=4.60.2", # Dependency of matplotlib. Pinned because of dependabot alert.
    "pillow>=12.2.0",    # Dependency of matplotlib. Pinned because of dependabot alert.
]

[project.optional-dependencies]
# The tests import pvtlib (GERG-2008 and the differential pressure meter model).
test = [
    "pytest>=7.0",
    "pvtlib",
]
# Runs the example scripts and notebooks in examples/ (see examples/*/requirements.txt).
examples = [
    "pvtlib>=1.14.0",
    "notebook",
    "ipykernel",
    "nbclient",
]
# Builds the documentation site; see docs/conf.py.
docs = [
    "sphinx>=7.3",
    "myst-nb>=1.1",
    "furo>=2024.1.29",
]

[project.urls]
Homepage = "https://github.com/equinor/uncertaintylib"
Documentation = "https://equinor.github.io/uncertaintylib/"

[tool.setuptools.packages.find]
include = ["uncertaintylib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
